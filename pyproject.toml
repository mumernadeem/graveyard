[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graveyard-cli"
version = "0.2.0"
description = "Incident-Trained Deploy Gates. Turn your past postmortems into unbreakable deploy safeguards."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Umer Nadeem"}
]
keywords = [
    "ci-cd",
    "deploy-gates",
    "sre",
    "devops",
    "incident-management",
    "postmortems",
    "kubernetes",
    "policy-as-code",
    "compliance",
    "soc2"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/mumernadeem/graveyard"
Repository = "https://github.com/mumernadeem/graveyard"
Issues = "https://github.com/mumernadeem/graveyard/issues"

[project.scripts]
graveyard = "cli.graveyard:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
